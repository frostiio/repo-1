name: Reusable Workflow

on:
  workflow_call:
    inputs:
      env_input:
        required: true
        type: string

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Consume input ephemerally
        run: |
          echo "The passed value is:" # ${{ inputs.env_input }}"
          echo "::add-mask::${{ inputs.env_input }}"
          # Use the value directly in commands without writing to GITHUB_ENV or secrets
